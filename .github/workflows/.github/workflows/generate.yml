name: Generate SEO Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # lets you click "Run workflow" manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Generate pages
        run: node generate.js

      - name: Generate sitemap
        run: node sitemap.js

      - name: Commit generated pages
        run: |
          git config --global user.name "seo-bot"
          git config --global user.email "seo-bot@users.noreply.github.com"

          git add .
          git commit -m "Auto-generate SEO pages" || echo "No changes to commit"
          git push
